services:
  postgres:
    image: postgres:16-alpine
    container_name: agentic-calendar
    restart: unless-stopped
    ports:
      - "5442:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentic_calendar_app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
  adminer:
    image: adminer
    container_name: agentic-calendar-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  postgres_data:
